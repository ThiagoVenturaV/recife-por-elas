name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Backend
        working-directory: backend
        env:
          APP_SECRET: test-only-secret-with-at-least-32-bytes
        run: |
          npm ci
          npm test
          npm run build
          npm audit --audit-level=high
      - name: Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npm audit --audit-level=high
